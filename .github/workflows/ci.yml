name: Verification du projet
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vérifier la présence de l'archive source
        run: test -f a-deux-source.tar.gz
      - name: Extraire les sources
        run: tar -xzf a-deux-source.tar.gz -C .
      - name: Installer les dépendances
        run: npm ci
      - name: Tests
        run: npm test
      - name: Compilation
        run: npm run build
