name: Vérification du projet

on:
  push:
    branches: [main, genspark/qspicy-refonte]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Tests et cohérence du catalogue
        run: npm test
      - name: Compilation de production
        run: npm run build
