name: Vérification du projet

on:
  push:
    branches: [main, genspark/qspicy-refonte]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vérifier que l'archive source est à jour
        run: |
          mkdir -p /tmp/archive
          tar -xzf a-deux-source.tar.gz -C /tmp/archive
          cd /tmp/archive
          fail=0
          while IFS= read -r file; do
            if ! cmp -s "$file" "$GITHUB_WORKSPACE/$file"; then
              echo "::error file=$file::L'archive a-deux-source.tar.gz ne correspond plus au dépôt. Exécuter npm run pack:source."
              fail=1
            fi
          done < <(find . -type f | sed 's|^\./||')
          exit $fail
      - name: Installer les dépendances
        run: npm ci
      - name: Tests et cohérence du catalogue
        run: npm test
      - name: Compilation de production
        run: npm run build
