name: Vérification du projet

on:
  push:
    branches: [main, genspark/qspicy-refonte, 'qspicy/**', 'fix/**']
  pull_request:
    branches: [main, 'integrate/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DB: qspicy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérification TypeScript
        run: npm run typecheck
      - name: Tests unitaires et cohérence du catalogue
        run: npm test
      - name: Compilation de production
        run: npm run build
      - name: Installer le client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Recette d'intégration PostgreSQL 16
        run: bash supabase/tests/run_postgres.sh
      - name: Installer Playwright pour la recette navigateur
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Recettes navigateur responsive et Zone 2
        run: npx playwright test
